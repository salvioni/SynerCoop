services:
  # Backend (Express) — API em Node, banco Postgres gerenciado pelo Render.
  - type: web
    name: synercoop-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Gerado automaticamente pelo Render — nunca hardcode isso no repo.
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: synercoop-db
          property: connectionString
      # Preencher manualmente no painel do Render depois do primeiro deploy,
      # com a URL pública do serviço synercoop-frontend abaixo.
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

  # Frontend (Vite/React) — site estático servido via CDN do Render.
  - type: web
    name: synercoop-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # BrowserRouter (client-side routing) — sem isso, dar F5 em /app/qualquer-coisa vira 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Preencher manualmente com a URL do serviço synercoop-backend acima.
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_FACEBOOK_APP_ID
        sync: false

databases:
  - name: synercoop-db
    plan: free
    databaseName: synercoop
    user: synercoop
