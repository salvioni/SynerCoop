services:
  # Backend (Express) — API em Node, banco Postgres gerenciado pelo Render.
  - type: web
    name: synercoop-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Esse deploy é uma demo pública (ver render.yaml no repo) — mantém as
      # contas "Entrar como X (demo)" da Landing Page ativas. Numa instância
      # de produção real, remova esta variável (ou defina como "false").
      - key: SEED_DEMO_DATA
        value: 'true'
      # Gerado automaticamente pelo Render — nunca hardcode isso no repo.
      - key: JWT_SECRET
        generateValue: true
      # Banco externo (Supabase/Neon): preencher no painel com a connection
      # string do provedor. O bloco `databases:` no fim deste arquivo cria um
      # Postgres gerenciado pelo Render — o free tier dele EXPIRA em 90 dias e
      # o banco é apagado, derrubando a API com ENOTFOUND no host `dpg-...`.
      # Por isso a URL vem de fora por padrão.
      - key: DATABASE_URL
        sync: false
      # Obrigatório: sem isso o boot aborta em produção (ver seed.js).
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      # Preencher manualmente no painel do Render depois do primeiro deploy,
      # com a URL pública do serviço synercoop-frontend abaixo.
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # Frontend (Vite/React) — site estático servido via CDN do Render.
  - type: web
    name: synercoop-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # BrowserRouter (client-side routing) — sem isso, dar F5 em /app/qualquer-coisa vira 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Preencher manualmente com a URL do serviço synercoop-backend acima.
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_FACEBOOK_APP_ID
        sync: false

# Postgres gerenciado pelo Render. Mantido comentado de propósito: no free
# tier ele é apagado após 90 dias e a API cai com
# `getaddrinfo ENOTFOUND dpg-...`. Preferir um Postgres externo (Supabase)
# via DATABASE_URL. Descomente apenas se assinar um plano pago aqui.
# databases:
#   - name: synercoop-db
#     plan: free
#     databaseName: synercoop
#     user: synercoop
